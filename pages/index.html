<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <title>My Mini Tools</title>
    <style>
      :root { color-scheme: light; }
      body { margin: 0; font-family: system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; background: #f8fafc; color: #1e293b; }
      main { max-width: 480px; margin: 0 auto; padding: calc(env(safe-area-inset-top, 0px) + 32px) 20px 40px; }
      h1 { font-size: 22px; margin: 0 0 6px; }
      p.sub { margin: 0 0 24px; color: #64748b; font-size: 14px; }
      a.app { display: flex; gap: 14px; align-items: center; padding: 14px; margin-bottom: 12px; background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; text-decoration: none; color: inherit; }
      a.app:active { background: #f1f5f9; }
      a.app img { width: 56px; height: 56px; border-radius: 14px; }
      a.app strong { display: block; font-size: 16px; }
      a.app span { font-size: 13px; color: #64748b; }
      .note { margin-top: 24px; font-size: 13px; color: #64748b; line-height: 1.6; background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 14px 16px; }
    </style>
  </head>
  <body>
    <main>
      <h1>My Mini Tools</h1>
      <p class="sub">打开后在 Chrome 菜单里点「添加到主屏幕」即可像 App 一样使用。</p>
      <a class="app" href="./bill-manager/">
        <img src="./bill-manager.png" alt="" />
        <div><strong>账单管家</strong><span>店面进货账单录入、月度申报统计</span></div>
      </a>
      <a class="app" href="./finance-manager/">
        <img src="./finance-manager.png" alt="" />
        <div><strong>个人记账本</strong><span>个人收支分类记账、月度 / 年度统计</span></div>
      </a>
      <div class="note">
        数据只保存在这台手机的浏览器里，不会上传。<br />
        从旧版搬数据：旧版「统计」页导出备份 → 新版「统计」页导入。
      </div>
    </main>
  </body>
</html>
